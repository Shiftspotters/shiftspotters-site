<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- Window chrome dots (monochrome, monoBrand-safe) -->
  <circle cx="140" cy="70" r="12" fill="#484f58"/>
  <circle cx="185" cy="70" r="12" fill="#484f58"/>
  <circle cx="230" cy="70" r="12" fill="#484f58"/>

  <g font-family="Consolas, 'JetBrains Mono', Menlo, monospace">
    <!-- First prompt line -->
    <text x="130" y="200" font-size="40" fill="#e6edf3">
      <tspan fill="#7ee787">$</tspan> shift-spotters --about
    </text>

    <!-- Four content rows: label (muted) + value (near-white), monospace columns -->
    <text x="170" y="320" font-size="32" fill="#7d8590">name</text>
    <text x="380" y="320" font-size="32" fill="#e6edf3">Shift Spotters</text>

    <text x="170" y="372" font-size="32" fill="#7d8590">focus</text>
    <text x="380" y="372" font-size="32" fill="#e6edf3">AI-tool ecosystem</text>

    <text x="170" y="424" font-size="32" fill="#7d8590">writing</text>
    <text x="380" y="424" font-size="32" fill="#e6edf3">field notes, pattern-spotting, essays</text>

    <text x="170" y="476" font-size="32" fill="#7d8590">audience</text>
    <text x="380" y="476" font-size="32" fill="#e6edf3">devs first, everyone welcome</text>

    <!-- Ending prompt with static block cursor -->
    <text x="130" y="560" font-size="40" fill="#7ee787">$</text>
  </g>

  <!-- Cursor block (drawn as rect for reliable rendering) -->
  <rect x="168" y="535" width="20" height="30" fill="#e6edf3"/>
</svg>
