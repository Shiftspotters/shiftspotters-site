<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">Bimodal switching-cost distribution across seven AI tools</title>
  <desc id="desc">Two-column diagram comparing switching cost across seven AI tools. Left column, LOW switching cost, new-generation tools: /watch (plugin uninstall), OpenDesign (portable artifacts), Higgsfield MCP (MCP server swap), Gemini CLI (CLI muscle-memory only). Right column, HIGH switching cost, predates the coding-agent wave: React (framework shape), HeyGen (brand-kit and avatar lock-in), Housecall Pro (payment and customer-history lock-in).</desc>

  <style>
    .col-header { font: 600 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #111; }
    .col-sub    { font: 400 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #555; }
    .tool-name  { font: 600 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #111; }
    .tool-mech  { font: 400 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #444; }
    .divider    { stroke: #999; stroke-width: 1; }
    .col-rule   { stroke: #ddd; stroke-width: 1; }
    .box        { fill: none; stroke: #ccc; stroke-width: 1; }
  </style>

  <!-- Column headers -->
  <text x="200" y="40" text-anchor="middle" class="col-header">LOW switching cost</text>
  <text x="200" y="60" text-anchor="middle" class="col-sub">new-generation (2025 →)</text>

  <text x="600" y="40" text-anchor="middle" class="col-header">HIGH switching cost</text>
  <text x="600" y="60" text-anchor="middle" class="col-sub">predates coding-agent wave</text>

  <!-- Horizontal divider under headers -->
  <line x1="40" y1="80" x2="760" y2="80" class="divider"/>

  <!-- Vertical divider between columns -->
  <line x1="400" y1="20" x2="400" y2="540" class="col-rule"/>

  <!-- LEFT COLUMN (LOW) — 4 tools -->
  <!-- /watch -->
  <rect x="60" y="110" width="280" height="80" rx="4" class="box"/>
  <text x="80" y="140" class="tool-name">/watch</text>
  <text x="80" y="165" class="tool-mech">plugin uninstall</text>

  <!-- OpenDesign -->
  <rect x="60" y="210" width="280" height="80" rx="4" class="box"/>
  <text x="80" y="240" class="tool-name">OpenDesign</text>
  <text x="80" y="265" class="tool-mech">portable artifacts</text>

  <!-- Higgsfield MCP -->
  <rect x="60" y="310" width="280" height="80" rx="4" class="box"/>
  <text x="80" y="340" class="tool-name">Higgsfield MCP</text>
  <text x="80" y="365" class="tool-mech">MCP server swap</text>

  <!-- Gemini CLI -->
  <rect x="60" y="410" width="280" height="80" rx="4" class="box"/>
  <text x="80" y="440" class="tool-name">Gemini CLI</text>
  <text x="80" y="465" class="tool-mech">CLI muscle-memory only</text>

  <!-- RIGHT COLUMN (HIGH) — 3 tools -->
  <!-- React -->
  <rect x="460" y="110" width="280" height="80" rx="4" class="box"/>
  <text x="480" y="140" class="tool-name">React</text>
  <text x="480" y="165" class="tool-mech">framework shape</text>

  <!-- HeyGen -->
  <rect x="460" y="210" width="280" height="80" rx="4" class="box"/>
  <text x="480" y="240" class="tool-name">HeyGen</text>
  <text x="480" y="265" class="tool-mech">brand-kit + avatar lock-in</text>

  <!-- Housecall Pro -->
  <rect x="460" y="310" width="280" height="80" rx="4" class="box"/>
  <text x="480" y="340" class="tool-name">Housecall Pro</text>
  <text x="480" y="365" class="tool-mech">payment + customer-history lock-in</text>
</svg>
